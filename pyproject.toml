[project]
name = "possibleworks"
version = "1.0.0"
description = "White-label branding app for Frappe/ERPNext"
requires-python = ">=3.10"
readme = "README.md"
authors = [
    { name = "Possibleworks", email = "contact@possibleworks.com" },
]
license = { text = "MIT" }

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=16.0.0,<17.0.0"
